<!DOCTYPE html>
<html lang="en"><head><title></title><script>
  // BotGuard client for web PO Tokens, run in the host's hidden web view. Based on and ported from
  // Metrolist (https://github.com/MetrolistGroup/Metrolist) by way of the Milkbeat app's po_token.html.
  // The page has no network: the plugin fetches the challenge and the integrity token and passes them
  // in through mb.browser.evaluate, which awaits these functions.
  var poTokenMinter = null;
  var webPoSignalOutput = null;

  function loadBotGuard(globalName, program) {
    var vm = window[globalName];
    if (!vm) throw new Error('BotGuard VM not found in the global object');
    if (!vm.a) throw new Error('BotGuard could not load the program');
    var vmFunctions = null;
    try {
      vm.a(program, function (asyncSnapshotFunction, shutdownFunction, passEventFunction, checkCameraFunction) {
        vmFunctions = {
          asyncSnapshotFunction: asyncSnapshotFunction,
          shutdownFunction: shutdownFunction,
          passEventFunction: passEventFunction,
          checkCameraFunction: checkCameraFunction
        };
      }, true, undefined, function () {}, [[], []]);
    } catch (e) {
      throw new Error('BotGuard failed to execute the program: ' + e.message);
    }
    return new Promise(function (resolve, reject) {
      var attempts = 0;
      var poll = setInterval(function () {
        if (vmFunctions && vmFunctions.asyncSnapshotFunction) {
          clearInterval(poll);
          resolve(vmFunctions);
        } else if (++attempts >= 10000) {
          clearInterval(poll);
          reject(new Error('Timed out waiting for asyncSnapshotFunction'));
        }
      }, 1);
    });
  }

  function snapshot(vmFunctions, signalOutput) {
    return new Promise(function (resolve, reject) {
      try {
        vmFunctions.asyncSnapshotFunction(function (response) { resolve(response); }, [undefined, undefined, signalOutput, undefined]);
      } catch (e) {
        reject(new Error('BotGuard snapshot failed: ' + e.message));
      }
    });
  }

  // Runs the challenge from /api/jnn/v1/Create; resolves to the response GenerateIT wants.
  async function runBotGuard(challenge) {
    var interpreter = challenge.interpreterJavascript.privateDoNotAccessOrElseSafeScriptWrappedValue;
    if (!interpreter) throw new Error('Could not load the BotGuard VM: no interpreter JavaScript');
    new Function(interpreter)();
    var signalOutput = [];
    var vmFunctions = await loadBotGuard(challenge.globalName, challenge.program);
    var response = await snapshot(vmFunctions, signalOutput);
    webPoSignalOutput = signalOutput;
    return response;
  }

  // Creates the minter once per attestation from the integrity token's bytes.
  async function createPoTokenMinter(integrityTokenBytes) {
    var getMinter = webPoSignalOutput && webPoSignalOutput[0];
    if (typeof getMinter !== 'function') throw new Error('PMD: webPoSignalOutput[0] is not a function');
    var minter = await getMinter(new Uint8Array(integrityTokenBytes));
    if (typeof minter !== 'function') throw new Error('APF: the minter is not a function');
    poTokenMinter = minter;
    return 'ok';
  }

  // Mints a token bound to the identifier's UTF-8 bytes; resolves to the token's bytes.
  async function obtainPoToken(identifierBytes) {
    if (!poTokenMinter) throw new Error('MNT: the minter was not created');
    var result = await poTokenMinter(new Uint8Array(identifierBytes));
    if (!(result instanceof Uint8Array) || result.length === 0) {
      throw new Error('ODM: invalid mint result ' + Object.prototype.toString.call(result));
    }
    return Array.from(result);
  }
</script></head><body></body></html>
