name: Android CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Collapse superseded runs on branches and PRs. Tag runs publish the release
# artifacts and must never be cancelled by a subsequent push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  # Certificate of the Flow-TV fork's own release key (not upstream Flow's).
  # Installed builds pin this value; an APK signed with anything else cannot
  # be installed as an update. Changing it forces a reinstall.
  EXPECTED_SIGNER_SHA256: fefb39d0d5f3df3bbbd0b7ccf7fed716a0a13ebd17ac529b0c1a8ec3c1f7a3f8

# This fork ships the Android TV build only: the foss flavor (no in-app updater,
# which would point at upstream Flow). The github and nightly variants are not
# built or published here.
jobs:
  build:
    name: Build TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: >
          ./gradlew spotlessCheck
          --build-cache --stacktrace

      - name: Decode Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          elif [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            # Main and tag builds are published as releases; unsigned APKs
            # cannot be installed, so refuse rather than publish them.
            echo "::error::RELEASE_KEYSTORE_BASE64 is unavailable. Refusing to build unsigned release APKs."
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secret is not available. Continuing with an unsigned CI build."
          fi

      - name: Run unit tests
        run: >
          ./gradlew :app:testFossDebugUnitTest
          --max-workers=1 --build-cache --stacktrace

      # Instrumentation tests are not executed in CI, but they must still
      # compile: breakage here otherwise lands on main unnoticed.
      - name: Compile instrumentation tests
        run: >
          ./gradlew :app:compileFossDebugAndroidTestKotlin
          --build-cache --stacktrace

      - name: Lint TV release
        run: >
          ./gradlew :app:lintFossRelease
          --build-cache --stacktrace

      - name: Build TV release APKs
        run: >
          ./gradlew :app:assembleFossRelease
          --max-workers=1 --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # A wrong or missing key is unrecoverable for installed copies, so fail
      # the build rather than publish. Skipped when no keystore was available,
      # e.g. on fork PRs.
      - name: Verify release signing certificate
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        run: |
          set -uo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the runner Android SDK."
            exit 1
          fi

          status=0
          for apk in \
            app/build/outputs/apk/foss/release/app-foss-universal-release.apk \
            app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk \
            app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release.apk
          do
            if [ ! -f "$apk" ]; then
              echo "::error::Missing expected APK $apk"
              status=1
              continue
            fi
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
              status=1
            else
              echo "OK $(basename "$apk") -> $actual"
            fi
          done
          exit $status

      - name: Report individual APK sizes
        shell: bash
        run: |
          shopt -s nullglob
          apks=(
            app/build/outputs/apk/foss/release/app-foss-universal-release*.apk
            app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk
            app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release*.apk
          )
          expected=3

          if (( ${#apks[@]} != expected )); then
            printf 'Expected %d published APKs, found %d.\n' "$expected" "${#apks[@]}" >&2
            exit 1
          fi

          {
            echo '## Individual APK sizes'
            echo
            echo '| APK | Size | Exact bytes |'
            echo '|---|---:|---:|'
            for apk in "${apks[@]}"; do
              bytes=$(stat --format='%s' "$apk")
              size=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')
              printf '| `%s` | %s | %s |\n' "$(basename "$apk")" "$size" "$bytes"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TV universal APK
        uses: actions/upload-artifact@v7
        with:
          name: flow-foss-universal-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-universal-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload TV ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: flow-foss-arm64-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload TV ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: flow-foss-armeabi-v7a-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download release APKs
        uses: actions/download-artifact@v8
        with:
          pattern: flow-foss-*-release-apk
          path: dist/
          merge-multiple: true

      # flow-foss.apk is a public contract: the Downloader code 7746081 and the
      # README link to releases/latest/download/flow-foss.apk. Do not rename it.
      - name: Rename APKs for release
        run: |
          set -euo pipefail
          mv dist/app-foss-universal-release.apk     dist/flow-foss.apk
          mv dist/app-foss-arm64-v8a-release.apk     dist/flow-foss-arm64-v8a.apk
          mv dist/app-foss-armeabi-v7a-release.apk   dist/flow-foss-armeabi-v7a.apk

      - name: Generate checksums
        run: |
          cd dist
          sha256sum flow*.apk > checksums.txt
          cat checksums.txt

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          test -s release-notes.md
          grep -Fqx "# Flow ${RELEASE_VERSION}" release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Flow ${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/flow-foss.apk
            dist/flow-foss-arm64-v8a.apk
            dist/flow-foss-armeabi-v7a.apk
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every push to main becomes a GitHub Release, so the newest signed build is
  # always at releases/latest/download/flow-foss.apk (Downloader code 7746081).
  publish-main:
    name: Publish main build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      # Tags are needed to find the previous build for the changelog range.
      - name: Checkout history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release APKs
        uses: actions/download-artifact@v8
        with:
          pattern: flow-foss-*-release-apk
          path: dist/
          merge-multiple: true

      - name: Rename APKs for release
        run: |
          set -euo pipefail
          mv dist/app-foss-universal-release.apk     dist/flow-foss.apk
          mv dist/app-foss-arm64-v8a-release.apk     dist/flow-foss-arm64-v8a.apk
          mv dist/app-foss-armeabi-v7a-release.apk   dist/flow-foss-armeabi-v7a.apk
          cd dist && sha256sum flow*.apk > checksums.txt && cat checksums.txt

      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          prev=$(git tag --list 'build-*' --sort=-v:refname | head -n 1)
          if [ -n "$prev" ]; then range="$prev..$GITHUB_SHA"; else range="$GITHUB_SHA"; fi
          latest="https://github.com/$REPO/releases/latest/download"
          {
            echo "## What's new"
            echo
            git log --no-merges --format='- %s (%h)' -n 50 "$range"
            echo
            echo "## Install on Android TV"
            echo
            echo "- **Downloader app:** enter code \`7746081\`"
            echo "- **Direct link (always the latest):** $latest/flow-foss.apk"
            echo
            echo "Per-ABI APKs (\`flow-foss-arm64-v8a.apk\`, \`flow-foss-armeabi-v7a.apk\`) and \`checksums.txt\` are attached below."
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/$REPO/compare/$prev...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Flow-TV build ${{ github.run_number }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/flow-foss.apk
            dist/flow-foss-arm64-v8a.apk
            dist/flow-foss-armeabi-v7a.apk
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
